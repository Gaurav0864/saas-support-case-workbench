  <path d="M18 0h1244a18 18 0 0 1 18 18v42H0V18A18 18 0 0 1 18 0Z" fill="#182235"/>
  <circle cx="30" cy="30" r="7" fill="#fb7185"/>
  <circle cx="54" cy="30" r="7" fill="#fbbf24"/>
